```yaml
name: Mandera Data Generator

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # allows manual run

concurrency:
  group: mandera-data-generator
  cancel-in-progress: false

jobs:
  generate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run script with retry logic
      - name: Run data generator
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ATTEMPTS=3
          COUNT=1

          until [ $COUNT -gt $ATTEMPTS ]
          do
            echo "Starting attempt $COUNT..."

            python data_generator/generate_transactions.py && break

            echo "Attempt $COUNT failed."

            if [ $COUNT -eq $ATTEMPTS ]; then
              echo "All retry attempts failed."
              exit 1
            fi

            COUNT=$((COUNT+1))

            echo "Retrying in 30 seconds..."
            sleep 30
          done
```
